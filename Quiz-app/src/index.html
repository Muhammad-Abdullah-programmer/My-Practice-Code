<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simple Quiz App</title>
  <!-- Tailwind via CDN - quick prototyping -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* small custom styles for better print/spacing */
    .option-btn:focus { outline: 3px solid rgba(59,130,246,0.25); }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">
  <main class="w-full max-w-2xl bg-white rounded-2xl shadow-lg p-6 md:p-10">
    <header class="mb-6">
      <h1 class="text-2xl md:text-3xl font-semibold text-slate-800">Quiz App</h1>
      <p class="text-sm text-slate-500 mt-1">Answer the questions — your score will appear at the end.</p>
    </header>

    <!-- Quiz container -->
    <section id="quiz" class="space-y-6">
      <!-- Question box -->
      <div id="questionCard" class="p-6 border rounded-lg bg-slate-50">
        <div class="flex items-start justify-between">
          <div>
            <p id="qNumber" class="text-sm text-slate-500">Question 1 of 5</p>
            <h2 id="qText" class="mt-2 text-lg md:text-xl font-medium text-slate-800">Loading...</h2>
          </div>
          <div class="text-right">
            <p class="text-sm text-slate-500">Score</p>
            <p id="liveScore" class="text-lg font-semibold text-indigo-600">0</p>
          </div>
        </div>

        <div id="options" class="mt-6 grid gap-3">
          <!-- option buttons will be injected here -->
        </div>
      </div>

      <!-- Controls -->
      <div class="flex items-center justify-between">
        <button id="prevBtn" class="px-4 py-2 rounded-lg border text-slate-700 hover:bg-slate-100 disabled:opacity-50" disabled>Previous</button>
        <div class="flex gap-2">
          <button id="clearBtn" class="px-4 py-2 rounded-lg border text-slate-700 hover:bg-slate-100">Clear Answer</button>
          <button id="nextBtn" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Next</button>
        </div>
      </div>

      <!-- Result area (hidden until end) -->
      <div id="result" class="hidden p-6 border rounded-lg bg-emerald-50">
        <h3 class="text-xl font-semibold text-slate-800">Your Result</h3>
        <p class="mt-2 text-slate-600">You scored <span id="finalScore" class="font-bold text-indigo-600">0</span> out of <span id="totalQ">0</span>.</p>
        <div class="mt-4 flex gap-3">
          <button id="retryBtn" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Retry</button>
          <button id="reviewBtn" class="px-4 py-2 border rounded-lg">Review Answers</button>
        </div>
      </div>

      <!-- Review list -->
      <div id="review" class="hidden p-4 border rounded-lg bg-slate-50 space-y-4">
        <h4 class="font-semibold">Review</h4>
        <div id="reviewList" class="space-y-3 text-sm text-slate-700"></div>
      </div>

    </section>

    <footer class="mt-6 text-xs text-slate-400">
      Built with HTML, Tailwind CSS and Vanilla JavaScript.
    </footer>
  </main>

  <!-- This is Java Script Code Started .............................................  -->

  <script>
    // --- Simple quiz data (you can extend or fetch from server) ---
    const quizData = [
      {
        question: 'Which language is primarily used to style web pages?',
        options: ['HTML', 'JavaScript', 'CSS', 'Python'],
        answer: 2 // index of correct option (0-based)
      },
      {
        question: 'What does DOM stand for?',
        options: ['Document Object Model', 'Data Object Model', 'Digital Object Map', 'Document Option Model'],
        answer: 0
      },
      {
        question: 'Which HTML tag is used for an ordered list?',
        options: ['<ul>', '<li>', '<ol>', '<list>'],
        answer: 2
      },
      {
        question: 'Which method is used to add an event listener in JavaScript?',
        options: ['attachEvent', 'addEventListener', 'onEvent', 'listenEvent'],
        answer: 1
      },
      {
        question: 'Which of these is NOT a JavaScript data type?',
        options: ['Undefined', 'Boolean', 'Float', 'Object'],
        answer: 2
      }
    ];

    // --- State ---
    let currentIndex = 0;
    let score = 0;
    const userAnswers = Array(quizData.length).fill(null);

    // --- Elements ---
    const qNumber = document.getElementById('qNumber');
    const qText = document.getElementById('qText');
    const optionsDiv = document.getElementById('options');
    const nextBtn = document.getElementById('nextBtn');
    const prevBtn = document.getElementById('prevBtn');
    const clearBtn = document.getElementById('clearBtn');
    const liveScore = document.getElementById('liveScore');
    const resultBox = document.getElementById('result');
    const finalScore = document.getElementById('finalScore');
    const totalQSpan = document.getElementById('totalQ');
    const retryBtn = document.getElementById('retryBtn');
    const reviewBtn = document.getElementById('reviewBtn');
    const reviewDiv = document.getElementById('review');
    const reviewList = document.getElementById('reviewList');

    // --- Functions ---
    function renderQuestion() {
      const q = quizData[currentIndex];
      qNumber.textContent = `Question ${currentIndex + 1} of ${quizData.length}`;
      qText.textContent = q.question;

      optionsDiv.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'option-btn w-full text-left px-4 py-3 rounded-lg border hover:bg-slate-100';
        btn.innerHTML = `<span class="inline-block mr-3 font-medium">${String.fromCharCode(65 + idx)}.</span> ${opt}`;
        btn.dataset.index = idx;

        // show selection if user already answered
        if (userAnswers[currentIndex] === idx) {
          btn.classList.add('bg-indigo-50', 'border-indigo-300');
        }

        btn.addEventListener('click', () => selectOption(idx));
        optionsDiv.appendChild(btn);
      });

      // update controls
      prevBtn.disabled = currentIndex === 0;
      liveScore.textContent = score;
    }

    

    function selectOption(idx) {
      // record the answer
      const prev = userAnswers[currentIndex];
      if (prev !== null) {
        // if changing an already-correct answer we may need to update score
        if (prev === quizData[currentIndex].answer) score--;
      }

      userAnswers[currentIndex] = idx;

      // if newly correct
      if (idx === quizData[currentIndex].answer) score++;

      // visually mark selected option
      Array.from(optionsDiv.children).forEach(btn => {
        btn.classList.remove('bg-indigo-50','border-indigo-300');
      });
      const selectedBtn = Array.from(optionsDiv.children).find(b => Number(b.dataset.index) === idx);
      if (selectedBtn) selectedBtn.classList.add('bg-indigo-50','border-indigo-300');

      liveScore.textContent = score;
    }

    function clearAnswer() {
      const prev = userAnswers[currentIndex];
      if (prev !== null) {
        if (prev === quizData[currentIndex].answer) score--;
        userAnswers[currentIndex] = null;
        Array.from(optionsDiv.children).forEach(btn => btn.classList.remove('bg-indigo-50','border-indigo-300'));
        liveScore.textContent = score;
      }
    }

    function goNext() {
      if (currentIndex < quizData.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        showResult();
      }
    }

    function goPrev() {
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
      }
    }

    function showResult() {
      // hide quiz area and show result
      resultBox.classList.remove('hidden');
      document.getElementById('quiz').scrollIntoView({ behavior: 'smooth' });
      finalScore.textContent = score;
      totalQSpan.textContent = quizData.length;
      // also optionally show review
      buildReview();
    }

    function buildReview() {
      reviewList.innerHTML = '';
      quizData.forEach((q, i) => {
        const userA = userAnswers[i];
        const correct = q.answer;
        const item = document.createElement('div');
        item.className = 'p-3 rounded-lg border bg-white';
        item.innerHTML = `\n          <div class="flex items-start justify-between">\n            <div>\n              <p class="text-sm text-slate-500">Q${i + 1}.</p>\n              <p class="font-medium text-slate-800">${q.question}</p>\n              <p class="mt-2 text-sm">Your answer: <span class="font-semibold">${userA === null ? 'No answer' : q.options[userA]}</span></p>\n              <p class="text-sm">Correct answer: <span class="font-semibold">${q.options[correct]}</span></p>\n            </div>\n            <div class="text-right">\n              <p class="text-sm">${userA === correct ? '<span class=\"text-green-600 font-semibold\">Correct</span>' : '<span class=\"text-red-600 font-semibold\">Wrong</span>'}</p>\n            </div>\n          </div>\n        `;
        reviewList.appendChild(item);
      });
    }

    function retry() {
      currentIndex = 0;
      score = 0;
      for (let i = 0; i < userAnswers.length; i++) userAnswers[i] = null;
      resultBox.classList.add('hidden');
      reviewDiv.classList.add('hidden');
      renderQuestion();
    }

    // --- Event listeners ---
    nextBtn.addEventListener('click', goNext);
    prevBtn.addEventListener('click', goPrev);
    clearBtn.addEventListener('click', clearAnswer);
    retryBtn.addEventListener('click', retry);
    reviewBtn.addEventListener('click', () => {
      reviewDiv.classList.toggle('hidden');
      document.getElementById('review').scrollIntoView({ behavior: 'smooth' });
    });

    // keyboard support: 1-4 to pick option, n for next, p for prev
    document.addEventListener('keydown', (e) => {
      if (e.key >= '1' && e.key <= '9') {
        const choice = Number(e.key) - 1;
        if (choice < quizData[currentIndex].options.length) selectOption(choice);
      }
      if (e.key === 'n') goNext();
      if (e.key === 'p') goPrev();
      if (e.key === 'c') clearAnswer();
    });

    // initial render
    renderQuestion();
  </script>
</body>
</html>
